# Modified on 2026-10-09 for CogineBot's reporting routes and source support.
name: Bug report
description: Report a reproducible problem in CogineBot
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Report security issues [privately](https://github.com/cogine-ai/CogineBot/security/advisories/new). For ordinary bugs, use a minimal reproduction with synthetic data.
  - type: textarea
    id: description
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that reproduces the issue.
      placeholder: |
        1. Start a local development instance
        2. Create a bot with synthetic input
        3. Observe the result
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or branch
      placeholder: main at abc1234
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js/pnpm versions, app surface, agent runtime, and sandbox provider where relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted error or screenshot
      description: Share only a minimal excerpt. Remove keys, cookies, personal paths, account identifiers, and private data. Do not paste .env files.
