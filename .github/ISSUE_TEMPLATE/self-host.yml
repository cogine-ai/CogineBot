# Modified on 2026-10-09 for CogineBot's reporting routes and source support.
name: Development setup help
description: Get help with a source checkout, database, or local build
title: "[Setup]: "
body:
  - type: markdown
    attributes:
      value: |
        Start with the [development guide](https://github.com/cogine-ai/CogineBot/blob/main/docs/development.md). CogineBot has no company release installer yet. Report security issues [privately](https://github.com/cogine-ai/CogineBot/security/advisories/new).
  - type: dropdown
    id: step
    attributes:
      label: Which step fails?
      options:
        - Repository check
        - Dependency installation
        - Prisma generation or migration
        - Typecheck, lint, build, or tests
        - Local API, worker, web, or sandbox startup
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or branch
      placeholder: main at abc1234
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and error
      description: Include the exact command and a short redacted error. Remove credentials, personal paths, and private data. Do not paste .env files.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js/pnpm versions, and PostgreSQL/Docker versions where relevant.
    validations:
      required: true
