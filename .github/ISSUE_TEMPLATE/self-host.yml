# Modified on 2026-10-16 for CogineBot's released installers and source support.
name: Installation and setup help
description: Get help with desktop installation, a server, or a source checkout
title: "[Setup]: "
body:
  - type: markdown
    attributes:
      value: |
        For a source checkout, start with the [development guide](https://github.com/cogine-ai/CogineBot/blob/main/docs/development.md). For published installers and their platform/signing notes, use [CogineBot Releases](https://github.com/cogine-ai/CogineBot/releases). Report security issues [privately](https://github.com/cogine-ai/CogineBot/security/advisories/new).
  - type: dropdown
    id: step
    attributes:
      label: Which step fails?
      options:
        - Desktop installation or update
        - This computer local instance
        - Existing instance connection
        - Published-image server setup
        - Repository check
        - Dependency installation
        - Prisma generation or migration
        - Typecheck, lint, build, or tests
        - Local API, worker, web, or sandbox startup
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Release version or commit
      placeholder: v0.2.1, or main at abc1234
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Steps and error
      description: Describe the actions or steps that failed and any error shown. Include the command if you used one. Remove credentials, personal paths, and private data. Do not paste .env files.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your OS and, where relevant, Docker/Compose, PostgreSQL, or Node.js/pnpm versions.
    validations:
      required: true
