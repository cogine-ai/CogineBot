name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: "1"
  NODE_ENV: test
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  AGENT_RUNTIME: scripted
  SANDBOX_PROVIDER: fake
  CLOUD_AGENT_PROVIDER: emulator
  WAKEUP_DRIVER: memory
  VERIFY_PROVIDERS: ""
  VERIFY_DATABASE: ""
  VERIFY_LOGGING: ""
  RUN_COMPUTER_E2E: ""
  RUN_COMPUTER_REPLAY_DOCKER: ""
  OPENROUTER_API_KEY: ""
  MODEL_API_KEY: ""
  COMPOSIO_API_KEY: ""
  CURSOR_API_KEY: ""
  AXIOM_TOKEN: ""
  AXIOM_DATASET: ""
  LOG_LEVEL: "off"

jobs:
  repository:
    name: Repository documentation and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.16.0
      - run: node scripts/check-repository.mjs
      - run: bash scripts/lint-workflows.sh

  checks:
    name: ${{ matrix.check }}
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Lint and typecheck
            lane: static
            timeout: 15
          - check: Web production build
            lane: build
            timeout: 15
          - check: Default offline unit tests
            lane: unit
            timeout: 20
          - check: Official PostgreSQL integration
            lane: integration
            timeout: 20
          - check: Selected fake web E2E
            lane: web
            timeout: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          mkdir -p test-report/repository-ci
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee test-report/repository-ci/install.log
      - name: Generate Prisma clients explicitly
        run: |
          set -euo pipefail
          pnpm db:generate 2>&1 | tee test-report/repository-ci/prisma-generate.log
      - name: Lint and typecheck
        if: matrix.lane == 'static'
        run: |
          set -euo pipefail
          pnpm lint 2>&1 | tee test-report/repository-ci/lint.log
          pnpm check 2>&1 | tee test-report/repository-ci/typecheck.log
      - name: Build the web application
        if: matrix.lane == 'build'
        run: |
          set -euo pipefail
          pnpm --filter @rakazo/web build 2>&1 | tee test-report/repository-ci/web-build.log
      - name: Run the default offline unit suite
        if: matrix.lane == 'unit'
        run: |
          set -euo pipefail
          pnpm run test --maxWorkers=2 --reporter=default --reporter=json --outputFile=test-report/repository-ci/unit-results.json 2>&1 | tee test-report/repository-ci/unit.log
      - name: Run the official isolated PostgreSQL suites
        if: matrix.lane == 'integration'
        run: |
          set -euo pipefail
          pnpm test:integration -- --sandbox=fake --runtime=scripted 2>&1 | tee test-report/repository-ci/integration.log
      - name: Install the Chromium test binary
        if: matrix.lane == 'web'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          pnpm --filter @rakazo/web exec playwright install chromium 2>&1 | tee test-report/repository-ci/chromium-install.log
      - name: Run selected web specs with the official offline harness
        if: matrix.lane == 'web'
        run: |
          set -euo pipefail
          pnpm test:e2e -- --sandbox=fake --runtime=scripted '--spec=(artifact-preview|artifacts-tab|markdown-table|peer-messages|spaces|desktop-shell|continuous-chat|composer-paste|composer-send-failure|routine-crud|sidebar-density|team-computer|teach-task|message-quote|message-hover-actions|mention-picker-keyboard|golden|run-failure|chat-progress-messages|group-chats|group-member-settings|group-chat-creation|avatar-studio|avatar-editor|avatar-motion|avatar-style|bot-crud|activity-list|ui-appearance|bot-organization|collapsible-sidebar-sections|sidebar-reporting-tree|sidebar-roster-title|sidebar-work-status|new-bot-ux|resizable-side-panel|consequential-approval|graphql-integrations|load-failure|mcp-oauth|stuck-work)\.spec\.ts' 2>&1 | tee test-report/repository-ci/web-e2e.log
      - name: Retain successful synthetic UI screenshots
        if: matrix.lane == 'web' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-ci-web-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            apps/web/test-results/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain failure diagnostics
        if: failure() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-ci-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-report/repository-ci/
            test-report/integration/summary.json
            test-report/e2e/summary.json
            playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish-mobile-update:
    name: Publish compatible mobile update
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EAS_BUILD_PROFILE: production
    concurrency:
      group: mobile-production-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the change is safe for OTA
        id: ota
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BEFORE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}"; then
            {
              echo "### Mobile OTA skipped"
              echo
              echo "Could not resolve \`github.event.before\` for the full push range, so this job will not publish a partial-range update."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t files < <(
            git diff --name-only "$base" "$GITHUB_SHA" -- \
              .github/workflows/repository-ci.yml \
              apps/mobile \
              package.json \
              packages/chat-ui \
              packages/contracts \
              packages/core \
              pnpm-lock.yaml
          )

          publish=false
          blocked=false
          for file in "${files[@]}"; do
            case "$file" in
              *.test.ts|*.test.tsx|*.d.ts)
                continue
                ;;
            esac

            eligible=false
            case "$file" in
              apps/mobile/app/*|apps/mobile/components/*|apps/mobile/lib/*)
                case "$file" in
                  *.ts|*.tsx) eligible=true ;;
                esac
                ;;
              packages/chat-ui/src/*)
                case "$file" in
                  *.ts|*.tsx|*.css) eligible=true ;;
                esac
                ;;
              packages/contracts/src/*|packages/core/src/*)
                case "$file" in
                  *.ts|*.tsx) eligible=true ;;
                esac
                ;;
            esac

            if [[ "$eligible" == true ]]; then
              publish=true
            else
              blocked=true
            fi
          done

          if [[ "$blocked" == true ]]; then
            publish=false
            {
              echo "### Mobile OTA skipped"
              echo
              echo "This revision changes native-sensitive mobile configuration, dependencies, modules, assets, or workflow files. Create new iOS and Android builds instead of publishing it to an older native runtime."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$publish" == true ]]; then
            {
              echo "### Mobile OTA eligible"
              echo
              echo "The revision only changes JavaScript, TypeScript, or bundled CSS used by the mobile client."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### No mobile OTA needed"
              echo
              echo "This revision does not change the shipped mobile bundle."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Require Expo automation token
        if: steps.ota.outputs.publish == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "Add an EXPO_TOKEN repository secret with access to your CogineBot Expo project." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: steps.ota.outputs.publish == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.ota.outputs.publish == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Expo
        if: steps.ota.outputs.publish == 'true'
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        if: steps.ota.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify mobile project
        if: steps.ota.outputs.publish == 'true'
        run: pnpm --filter @rakazo/mobile check
      - name: Publish production update
        if: steps.ota.outputs.publish == 'true'
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$head" ]]; then
            echo "Could not resolve the current main head before publishing." >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$head" ]]; then
            {
              echo "### Mobile OTA skipped"
              echo
              echo "This run is for \`$GITHUB_SHA\`, but \`main\` is now \`$head\`. Skipping so an older revision cannot overwrite a newer production update."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          eas update --platform all --channel production --environment production --message "$GITHUB_SHA" --non-interactive
