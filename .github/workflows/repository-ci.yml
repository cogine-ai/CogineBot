name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload generated screenshots and diagnostics
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  # A main run may publish an OTA update; let it finish before the next main run.
  queue: ${{ github.ref == 'refs/heads/main' && 'max' || 'single' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  CI: "1"
  NODE_ENV: test
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  AGENT_RUNTIME: scripted
  SANDBOX_PROVIDER: fake
  CLOUD_AGENT_PROVIDER: emulator
  WAKEUP_DRIVER: memory
  VERIFY_PROVIDERS: ""
  VERIFY_DATABASE: ""
  VERIFY_LOGGING: ""
  RUN_COMPUTER_E2E: ""
  RUN_COMPUTER_REPLAY_DOCKER: ""
  OPENROUTER_API_KEY: ""
  MODEL_API_KEY: ""
  COMPOSIO_API_KEY: ""
  CURSOR_API_KEY: ""
  AXIOM_TOKEN: ""
  AXIOM_DATASET: ""
  LOG_LEVEL: "off"

jobs:
  repository:
    name: Repository documentation and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.route.outputs.matrix }}
      has_checks: ${{ steps.route.outputs.has_checks }}
      web: ${{ steps.route.outputs.web }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.16.0
      - run: node scripts/check-repository.mjs
      - run: bash scripts/lint-workflows.sh
      - run: node --test scripts/ci-router.test.mjs
      - name: Route checks from the PR diff
        id: route
        run: node scripts/ci-router.mjs

  checks:
    name: ${{ matrix.check }}
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    if: needs.repository.outputs.has_checks == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.repository.outputs.matrix) }}
    env:
      CI_SHARD: ${{ matrix.shard }}
      CI_TEST_LANE: ${{ (matrix.lane == 'unit' || startsWith(matrix.lane, 'shell-')) && matrix.lane || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          mkdir -p test-report/repository-ci
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee test-report/repository-ci/install.log
      - name: Generate Prisma clients explicitly
        run: |
          set -euo pipefail
          pnpm db:generate 2>&1 | tee test-report/repository-ci/prisma-generate.log
      - name: Lint and typecheck
        if: matrix.lane == 'static'
        run: |
          set -euo pipefail
          node scripts/check-ci-coverage.mjs
          pnpm lint 2>&1 | tee test-report/repository-ci/lint.log
          pnpm check 2>&1 | tee test-report/repository-ci/typecheck.log
      - name: Build the web application
        if: matrix.lane == 'build'
        run: |
          set -euo pipefail
          pnpm --filter @rakazo/web build 2>&1 | tee test-report/repository-ci/web-build.log
      - name: Build the marketing site
        if: matrix.lane == 'marketing'
        run: pnpm --filter @rakazo/www build
      - name: Run the selected offline test lane
        if: matrix.lane == 'unit' || startsWith(matrix.lane, 'shell-')
        run: |
          set -euo pipefail
          pnpm run test --maxWorkers=2 --reporter=default --reporter=json --outputFile=test-report/repository-ci/unit-results.json 2>&1 | tee test-report/repository-ci/unit.log
      - name: Run the official isolated PostgreSQL suites
        if: matrix.lane == 'integration'
        run: |
          set -euo pipefail
          pnpm test:integration -- --sandbox=fake --runtime=scripted --shard="$CI_SHARD" 2>&1 | tee test-report/repository-ci/integration.log
      - name: Install Chromium and CJK fonts
        if: matrix.lane == 'web'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee test-report/repository-ci/cjk-fonts-install.log
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk 2>&1 | tee -a test-report/repository-ci/cjk-fonts-install.log
          fc-match 'sans-serif:lang=zh-cn' 2>&1 | tee -a test-report/repository-ci/cjk-fonts-install.log
          pnpm --filter @rakazo/web exec playwright install chromium 2>&1 | tee test-report/repository-ci/chromium-install.log
      - name: Run selected web specs with the official offline harness
        if: matrix.lane == 'web'
        run: |
          set -euo pipefail
          pnpm test:e2e -- --sandbox=fake --runtime=scripted --shard="$CI_SHARD" '--spec=(failure-recovery-auth|failure-recovery|routine-execution|messaging-settings|bot-templates|account-profile|model-settings|chat-reliability|artifact-preview|artifacts-tab|markdown-table|markdown-diagram|peer-messages|spaces|space-settings|desktop-shell|continuous-chat|composer-paste|composer-send-failure|routine-crud|sidebar-density|team-computer|teach-task|message-quote|message-hover-actions|mention-picker-keyboard|golden|run-failure|chat-progress-messages|group-chats|group-member-settings|group-chat-creation|avatar-studio|avatar-editor|avatar-motion|avatar-style|bot-crud|activity-list|ui-appearance|bot-organization|collapsible-sidebar-sections|sidebar-reporting-tree|sidebar-roster-title|sidebar-work-status|new-bot-ux|resizable-side-panel|consequential-approval|graphql-integrations|load-failure|mcp-oauth|stuck-work|connector-accounts|native-connectors|native-event-authoring|native-notion-webhook|native-batch2|native-remaining|mcp-approval-card|integration-setup|openapi-import|takeover-release|message-jump|billing-paywall|input-accessibility)\.spec\.ts' 2>&1 | tee test-report/repository-ci/web-e2e.log
      - name: Collect acceptance screenshots for this shard
        if: github.event_name == 'pull_request' && matrix.lane == 'web' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-shard-${{ strategy.job-index }}
          overwrite: true
          path: apps/web/test-results/
          if-no-files-found: error
          retention-days: 7
      - name: Retain successful synthetic UI screenshots
        if: inputs.upload_artifacts == true && matrix.lane == 'web' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-ci-web-screenshots-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            apps/web/test-results/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain failure diagnostics
        if: (inputs.upload_artifacts == true || (github.event_name == 'pull_request' && matrix.lane == 'web')) && failure() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-ci-${{ matrix.lane }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-report/repository-ci/
            test-report/integration/summary.json
            test-report/e2e/summary.json
            playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  screenshots:
    name: Verify UI acceptance screenshots
    needs: [repository, checks]
    if: github.event_name == 'pull_request' && needs.repository.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: acceptance-shard-*
          path: apps/web/test-results
          merge-multiple: true
      - name: Retain diagram UI acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagram-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/markdown-diagram-*/**/markdown-diagram-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain model connection acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-connection-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results/model-settings-*/**/a1-*.png
            apps/web/test-results/model-settings-*/**/chatgpt-plan-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain shared notification acceptance screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shared-notification-ui-screenshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/bot-crud-*/**/a3-shared-notification-setting.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain group and Space settings acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: group-space-settings-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results/space-settings-*/**/space-*.png
            apps/web/test-results/group-member-settings-*/**/a4-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain Bot template acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bot-template-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/bot-templates-*/**/a6-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain failure recovery acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-recovery-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/failure-recovery-*/**/b5-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain account and profile acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: account-profile-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/account-profile-*/**/a5-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain OpenAPI import acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-import-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/openapi-import-*/**/b23-openapi-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain takeover release acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: takeover-release-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/takeover-release-*/**/b31-takeover-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain message jump acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: message-jump-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/message-jump-*/**/b31-jump-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain passive computer panel acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: passive-computer-panel-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/team-computer-*/**/b41-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain visible computer attendance acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visible-computer-attendance-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/team-computer-*/**/b42-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain computer recovery acceptance screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: computer-recovery-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/chat-reliability-*/**/b43-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain access recovery acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: access-recovery-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/billing-paywall-*/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain chat input accessibility screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-input-accessibility-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/input-accessibility-*/**/*.png
          if-no-files-found: error
          retention-days: 7

  result:
    name: CI result
    needs: [repository, checks, screenshots]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check and screenshot validation
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          CHECKS_SELECTED: ${{ needs.repository.outputs.has_checks }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          SCREENSHOTS_SELECTED: ${{ github.event_name == 'pull_request' && needs.repository.outputs.web == 'true' }}
          SCREENSHOTS_RESULT: ${{ needs.screenshots.result }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_RESULT" == success ]]
          if [[ "$CHECKS_SELECTED" == true ]]; then
            [[ "$CHECKS_RESULT" == success ]]
          else
            [[ "$CHECKS_RESULT" == skipped ]]
          fi
          if [[ "$SCREENSHOTS_SELECTED" == true ]]; then
            [[ "$SCREENSHOTS_RESULT" == success ]]
          else
            [[ "$SCREENSHOTS_RESULT" == skipped ]]
          fi

  publish-mobile-update:
    name: Publish compatible mobile update
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: result
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EAS_BUILD_PROFILE: production
    concurrency:
      group: mobile-production-update
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check mobile publishing configuration
        id: mobile
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          configured=0
          for name in EXPO_OWNER EAS_PROJECT_ID EXPO_PUBLIC_API_URL EXPO_TOKEN; do
            value="${!name}"
            if [[ -n "${value//[[:space:]]/}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -eq 0 ]]; then
            {
              echo "### Mobile publishing is not configured"
              echo
              echo "No EAS update was published. Configure EXPO_OWNER, EAS_PROJECT_ID, EXPO_PUBLIC_API_URL, and EXPO_TOKEN together when mobile publishing is ready."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$configured" -ne 4 ]]; then
            echo "Mobile publishing is partially configured. Set EXPO_OWNER, EAS_PROJECT_ID, EXPO_PUBLIC_API_URL, and EXPO_TOKEN together." >&2
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: steps.mobile.outputs.configured == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.mobile.outputs.configured == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Expo
        if: steps.mobile.outputs.configured == 'true'
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        if: steps.mobile.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify mobile project
        if: steps.mobile.outputs.configured == 'true'
        run: pnpm --filter @rakazo/mobile check
      - name: Publish production update
        if: steps.mobile.outputs.configured == 'true'
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$head" ]]; then
            echo "Could not resolve the current main head before publishing." >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$head" ]]; then
            {
              echo "### Mobile OTA skipped"
              echo
              echo "This run is for \`$GITHUB_SHA\`, but \`main\` is now \`$head\`. Skipping so an older revision cannot overwrite a newer production update."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          eas update --platform all --channel production --environment production --message "$GITHUB_SHA" --non-interactive
