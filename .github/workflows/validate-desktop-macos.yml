name: Validate macOS distribution

on:
  # Bootstrap validation before this workflow exists on main. This branch never publishes.
  push:
    branches: [work/release-ownership]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-desktop-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Signed and notarized Universal macOS artifacts
    if: github.repository == 'cogine-ai/CogineBot' && github.ref_type == 'branch'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Build renderer and Electron main process
        run: pnpm --filter @rakazo/web build && pnpm --filter @rakazo/desktop build
        env:
          RAKAZO_ALLOW_DEV_SECRETS: "1"
      - name: Require macOS signing and notarization credentials
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY_P8"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          chmod 600 "$APPLE_API_KEY"
      - name: Package signed and notarized universal macOS app
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
        run: >-
          pnpm --filter @rakazo/desktop exec electron-builder
          --mac --universal --publish never -c.forceCodeSigning=true
      - name: Remove the App Store Connect API key from the runner
        if: always()
        env:
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
        run: rm -f "$APPLE_API_KEY"
      - name: Verify signature, notarization, architectures, and update ownership
        run: |
          set -euo pipefail
          app="apps/desktop/out/mac-universal/CogineBot.app"
          codesign --verify --deep --strict "$app"
          codesign -d --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"
          lipo -verify_arch x86_64 arm64 "$app/Contents/MacOS/CogineBot"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = ai.cogine.coginebot.desktop
          version="$(node -p "require('./apps/desktop/package.json').version")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          grep -Fqx "provider: github" "$app/Contents/Resources/app-update.yml"
          grep -Fqx "owner: cogine-ai" "$app/Contents/Resources/app-update.yml"
          grep -Fqx "repo: CogineBot" "$app/Contents/Resources/app-update.yml"
          grep -Fqx "version: $version" apps/desktop/out/latest-mac.yml
      - name: Verify distributable containers and record checksums
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').version")"
          out="$GITHUB_WORKSPACE/apps/desktop/out"
          dmg="$out/CogineBot-$version-universal.dmg"
          zip="$out/CogineBot-$version-universal-mac.zip"
          test -f "$dmg"
          test -f "$zip"
          test -f "$dmg.blockmap"
          test -f "$zip.blockmap"
          hdiutil verify "$dmg"
          unzip -tq "$zip"
          mountpoint="$(mktemp -d "$RUNNER_TEMP/coginebot-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mountpoint" >/dev/null 2>&1 || true
            rmdir "$mountpoint" || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$dmg"
          codesign --verify --deep --strict "$mountpoint/CogineBot.app"
          xcrun stapler validate "$mountpoint/CogineBot.app"
          spctl --assess --type execute "$mountpoint/CogineBot.app"
          extracted="$(mktemp -d "$RUNNER_TEMP/coginebot-zip.XXXXXX")"
          ditto -x -k "$zip" "$extracted"
          codesign --verify --deep --strict "$extracted/CogineBot.app"
          xcrun stapler validate "$extracted/CogineBot.app"
          spctl --assess --type execute "$extracted/CogineBot.app"
          diff -qr "$out/mac-universal/CogineBot.app" "$mountpoint/CogineBot.app"
          diff -qr "$out/mac-universal/CogineBot.app" "$extracted/CogineBot.app"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { readFileSync, statSync } = require('node:fs');
          const { createRequire } = require('node:module');
          const { basename, resolve } = require('node:path');
          const desktop = createRequire(resolve('apps/desktop/package.json'));
          const builder = createRequire(desktop.resolve('electron-builder'));
          const packager = createRequire(builder.resolve('app-builder-lib'));
          const { load } = packager('js-yaml');
          const out = resolve('apps/desktop/out');
          const { version } = desktop('./package.json');
          const feed = load(readFileSync(resolve(out, 'latest-mac.yml'), 'utf8'));
          assert.equal(feed.version, version);
          assert.equal(feed.files.length, 2);
          for (const file of feed.files) {
            assert.equal(file.url, basename(file.url));
            assert.ok([`CogineBot-${version}-universal.dmg`, `CogineBot-${version}-universal-mac.zip`].includes(file.url));
            const path = resolve(out, file.url);
            assert.equal(file.size, statSync(path).size);
            assert.equal(file.sha512, createHash('sha512').update(readFileSync(path)).digest('base64'));
          }
          assert.equal(new Set(feed.files.map(file => file.url)).size, 2);
          assert.equal(feed.path, `CogineBot-${version}-universal-mac.zip`);
          assert.equal(feed.sha512, feed.files.find(file => file.url === feed.path).sha512);
          NODE
          (
            cd "$out"
            shasum -a 256 "CogineBot-$version-universal.dmg" "CogineBot-$version-universal-mac.zip" *.blockmap latest-mac.yml > SHA256SUMS
          )
          {
            echo "## macOS distribution validation"
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "Version: $version"
            echo "Universal binary, Developer ID signature, notarization ticket, Gatekeeper, DMG and ZIP integrity passed."
            echo "Validation artifacts only. No release, tag, container image, or mobile update was published."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain validated installers and updater metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-validation-${{ github.sha }}
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*.blockmap
            apps/desktop/out/latest-mac.yml
            apps/desktop/out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
