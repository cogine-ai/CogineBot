  BOX_API_KEY:
  BOX_API_URL:
  BOX_BASE_URL:
  CLOUD_AGENT_PROVIDER:
  CLOUD_AGENT_SPACE_ID:
  CURSOR_API_KEY:
  BROWSER_PROVIDER:
  WEB_PROVIDER:
