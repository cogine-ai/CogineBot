<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">CogineBot — a foundation for coordinated agent work</title>
  <desc id="desc">CogineBot is an open-source project in preparation. A simple three-role diagram shows the planned coordinator, researcher, and reviewer workflow.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ddddda"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1l4 3-4 3" fill="none" stroke="#6c6c68" stroke-width="1.3"/></marker>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#f5f5f2"/>
  <rect x="672" y="0" width="608" height="360" rx="20" fill="url(#grid)"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#181816">
    <text x="56" y="69" font-size="12" font-weight="600" letter-spacing="2">OPEN SOURCE · APACHE-2.0</text>
    <text x="52" y="165" font-size="80" font-weight="700" letter-spacing="-4">CogineBot</text>
    <text x="56" y="216" font-size="23">A foundation for coordinated agent work.</text>
    <rect x="56" y="267" width="154" height="29" rx="14.5" fill="#181816"/>
    <text x="133" y="286" font-size="11" font-weight="600" letter-spacing="1.1" text-anchor="middle" fill="#ffffff">IN PREPARATION</text>
    <text x="235" y="287" font-size="12" fill="#676762">Built on Rakazo · History preserved</text>
    <text x="714" y="68" font-size="11" font-weight="600" letter-spacing="1.6" fill="#676762">PLANNED FIRST WORKFLOW</text>
    <g fill="#ffffff" stroke="#d2d2cd"><rect x="714" y="107" width="166" height="106" rx="14"/><rect x="938" y="107" width="166" height="106" rx="14"/><rect x="938" y="241" width="166" height="74" rx="14"/></g>
    <g font-size="17" font-weight="600"><text x="733" y="149">Coordinator</text><text x="957" y="149">Researcher</text><text x="957" y="275">Reviewer</text></g>
    <g font-size="12" fill="#676762"><text x="733" y="180">Plan · delegate · collect</text><text x="957" y="180">Find · compare · source</text><text x="957" y="297">Check · return findings</text></g>
    <path d="M888 143h40M929 178h-40M852 221v43h76M929 293H798v-72" stroke="#6c6c68" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="1153" y="121" width="78" height="86" rx="11" fill="#181816"/>
    <text x="1192" y="159" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">CSV</text>
    <text x="1192" y="181" font-size="10" text-anchor="middle" fill="#cececa">artifact</text>
    <path d="M868 100V88h324v24" stroke="#6c6c68" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>
